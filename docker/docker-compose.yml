services:

  app:
    build:
      context: ..
      dockerfile: Dockerfile

    container_name: kerala-go-app
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

      MINIO_ENDPOINT: minio:9000

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started

    volumes:
      - huggingface_cache:/root/.cache/huggingface


  postgres:
    image: postgres:16

    container_name: kerala-go-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-go_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-go_password}
      POSTGRES_DB: ${POSTGRES_DB:-kerala_go}

    ports:
      - "5432:5432"

    volumes:
      - postgres_existing:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-go_user} -d ${POSTGRES_DB:-kerala_go}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  qdrant:
    image: qdrant/qdrant:latest

    container_name: kerala-go-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_existing:/qdrant/storage


  minio:
    image: quay.io/minio/minio:latest

    container_name: kerala-go-minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: goadmin
      MINIO_ROOT_PASSWORD: GoSearch-MinIO-2026!

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_existing:/data

    command: server /data --console-address ":9001"


volumes:

  qdrant_existing:
    external: true
    name: qdrant_data

  minio_existing:
    external: true
    name: go-search_minio_data

  postgres_existing:
    external: true
    name: 031707b28330d55388d657a3910547124b2ba29f3ba9bf747bb2b03e9bdc8d76

  huggingface_cache:
    name: go-search_huggingface_cache